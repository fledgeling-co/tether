# Cargo workspace — cross-OS libraries/logic live in crates/ and are consumed by
# the native apps (UniFFI/swift-bridge) and Node (napi-rs) rather than being
# reimplemented per platform.
[workspace]
resolver = "2"
members = ["crates/core", "crates/model", "crates/runtime", "crates/relay", "crates/ffi", "crates/ingress", "crates/media"]

# Release builds strip debug info by default, and this Mac's Xcode strip leaves proc-macro dylibs that dyld refuses
# to load ("mis-aligned LINKEDIT string pool"). Build-time code isn't shipped, so it stays unstripped.
[profile.release.build-override]
strip = "none"
