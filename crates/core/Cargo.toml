[package]
name = "tether-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
spake2 = "=0.4.0"
snow = { version = "=0.10.0", default-features = false, features = ["std", "use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets", "zeroize"] }
curve25519-dalek = "=4.1.3"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1.8", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rand_chacha = "=0.3.1"
