[package]
name = "tether"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tether-core = { path = "../core" }
tether-media = { path = "../media" }
tokio = { version = "=1.54.1", features = ["full"] }
tokio-tungstenite = { version = "=0.26.2", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
clap = { version = "=4.5.26", features = ["derive"] }
url = "2.5"
fs2 = "0.4"
zeroize = "1.8"
socket2 = "=0.6.5"

[dev-dependencies]
tether-relay = { path = "../relay" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
