[package]
name = "tether-media"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rcgen = "=0.13.2"
tokio = { version = "=1.54.1", features = ["full"] }
bytes = "1"
rand = "0.8"
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.8"
