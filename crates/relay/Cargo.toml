[package]
name = "tether-relay"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "=0.8.4", features = ["ws"] }
tokio = { version = "=1.54.1", features = ["full"] }
futures-util = "=0.3.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "=2.2.0"
rand = "=0.8.6"
sha2 = "=0.10.9"
base64 = "=0.22.1"
hex = "=0.4.3"
data-encoding = "=2.6.0"

[dev-dependencies]
tokio-tungstenite = "=0.26.2"
