global
    maxconn 512
    tune.bufsize 65536

defaults
    mode tcp
    timeout connect 5s
    timeout client 65s
    timeout server 65s
    timeout tunnel 1h
    timeout client-fin 5s
    timeout server-fin 5s

frontend tls_public
    bind :8443
    stick-table type ipv6 size 10k expire 1m store conn_cur,conn_rate(1m)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 32 }
    tcp-request connection reject if { sc_conn_rate(0) gt 256 }
    tcp-request inspect-delay 5s
    acl tls_hello req.ssl_hello_type 1
    tcp-request content reject if WAIT_END !tls_hello
    tcp-request content accept if tls_hello
    acl control_host req.ssl_sni -i "relay.${TETHER_DOMAIN_SUFFIX}"
    acl app_host req.ssl_sni -m reg -i ^[a-z2-7]{52}\.
    acl app_suffix req.ssl_sni -m end -i ".${TETHER_DOMAIN_SUFFIX}"
    use_backend control_tls if control_host
    use_backend origin_tls if app_host app_suffix
    default_backend refused

backend control_tls
    server caddy caddy:8443 check

backend origin_tls
    server tether tether:8788 check

backend refused
    # No default target: unknown SNI never reaches a service.
